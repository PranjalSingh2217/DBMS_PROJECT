<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Finder - Smart Lost & Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            color: #667eea;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #95a5a6;
            font-size: 18px;
            font-weight: 300;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .tagline {
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 400;
            margin-top: 15px;
            letter-spacing: 0.3px;
        }

        .nav-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 40px;
        }

        .nav-card {
            padding: 30px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .nav-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            transition: left 0.3s ease;
            z-index: 1;
        }

        .nav-card:hover::before {
            left: 100%;
        }

        .nav-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .nav-card span {
            font-size: 32px;
            position: relative;
            z-index: 2;
        }

        .nav-card-text {
            position: relative;
            z-index: 2;
        }

        .features {
            margin-top: 50px;
            padding-top: 40px;
            border-top: 2px solid #ecf0f1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            text-align: center;
        }

        .feature {
            padding: 15px;
        }

        .feature-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .feature-text {
            color: #7f8c8d;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 36px;
            }

            .nav-container {
                grid-template-columns: 1fr;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 30px;
            }

            .nav-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> CAMPUS FINDER</h1>
            <p class="subtitle">Smart Lost & Found System</p>
            <p class="tagline">Connect lost items with their owners</p>
        </div>

        <div class="nav-container">
            <a href="report-item.html" class="nav-card">
                <span></span>
                <div class="nav-card-text">Report Item</div>
            </a>
            <a href="search.html" class="nav-card">
                <span></span>
                <div class="nav-card-text">Search Items</div>
            </a>
            <a href="my-claims.html" class="nav-card">
                <span></span>
                <div class="nav-card-text">My Claims</div>
            </a>
            <a href="matches.html" class="nav-card">
                <span></span>
                <div class="nav-card-text">Possible Matches</div>
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-text">Fast Recovery</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-text">Secure System</div>
            </div>
            <div class="feature">
                <div class="feature-icon"></div>
                <div class="feature-text">Community Trust</div>
            </div>
        </div>
    </div>
</body>
</html>
